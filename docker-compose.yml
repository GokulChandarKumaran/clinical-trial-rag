services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-local}
      TOP_K: ${TOP_K:-5}
      GROUNDEDNESS_THRESHOLD: ${GROUNDEDNESS_THRESHOLD:-0.55}
      # Only read when LLM_BACKEND=openai; absent otherwise, which is the point
      # of keeping the backend pluggable.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_HOST: http://ollama:11434
    volumes:
      # The index is a build artefact, not source. Mounting it keeps a 168 MB
      # binary out of the image and lets it be rebuilt without rebuilding.
      - ./data:/data:ro
    restart: unless-stopped

  # Optional: a larger local model than the in-process default.
  #   docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
