[pytest]
# `pythonpath = .` puts the project root on sys.path so `from app...` resolves.
#
# Without it, bare `pytest` fails collection with ModuleNotFoundError while
# `python -m pytest` works -- the latter prepends the working directory, the
# former does not. Locally the tests were run the second way and passed; CI ran
# them the first way, so the suite never actually executed there.
pythonpath = .
testpaths = tests
